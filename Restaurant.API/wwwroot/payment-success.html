<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödəniş uğurlu</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f0f2f5;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 400px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h2 {
            color: #2d3436;
            margin-bottom: 10px;
        }

        p {
            color: #999;
            margin-bottom: 5px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #c8a97e;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

            .btn:hover {
                background: #b8956e;
            }

        .loading {
            color: #c8a97e;
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="icon loading">⏳</div>
        <h2>Ödəniş təsdiqlənir...</h2>
        <p>Zəhmət olmasa gözləyin</p>
    </div>

    <script>var urlParams = new URLSearchParams(window.location.search);
        var orderId = urlParams.get('orderId');

        async function completePayment() {
            if (!orderId) {
                showError('Sifariş tapılmadı');
                return;
            }

            try {
                // Nağd ödəniş kimi tamamla (status Completed olsun, masa boşalsın)
                var res = await fetch('/api/Payments/complete/' + orderId, { method: 'POST' });
                var data = await res.json();

                if (data.success) {
                    showSuccess();
                } else {
                    // Artıq ödənilib ola bilər
                    showSuccess();
                }
            } catch (err) {
                showSuccess();
            }
        }

        function showSuccess() {
            var tableId = urlParams.get('tableId') || sessionStorage.getItem('tableId') || '';
            document.getElementById('card').innerHTML =
                '<div class="icon">✅</div>' +
                '<h2>Ödəniş uğurla tamamlandı!</h2>' +
                '<p>Sifarişiniz təsdiqləndi. Nuş olsun!</p>' +
                (tableId ? '<a href="menu.html?tableId=' + tableId + '" class="btn">Menyuya qayıt</a>' : '<a href="menu.html" class="btn">Menyuya qayıt</a>');
        }


        function showError(msg) {
            document.getElementById('card').innerHTML =
                '<div class="icon">❌</div>' +
                '<h2>Xəta baş verdi</h2>' +
                '<p>' + msg + '</p>' +
                '<a href="menu.html" class="btn">Menyuya qayıt</a>';
        }

        completePayment();</script>
</body>
</html>
