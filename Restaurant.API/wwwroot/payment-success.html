<script>
    var urlParams = new URLSearchParams(window.location.search);

    var kapitalId = urlParams.get('ID');
    var kapitalStatus = urlParams.get('STATUS');

    var orderId = urlParams.get('orderId');
    var tableId = urlParams.get('tableId') || localStorage.getItem('tableId') || '';

    if (kapitalId) {
        if ((kapitalStatus || '').toLowerCase() === 'fullypaid') {
            completeByPurchaseId(kapitalId);
        } else {
            showError();
        }
    } else if (orderId) {
        completeByOrderId(orderId);
    } else {
        showSuccess();
    }

    async function completeByPurchaseId(purchaseId) {
        try {
            var res = await fetch('/api/Payments/complete-by-purchase/' + purchaseId, { method: 'POST' });
            var data = await res.json();

            if (res.ok && data.success) {
                showSuccess();
            } else {
                showError();
            }
        } catch (err) {
            showError();
        }
    }

    async function completeByOrderId(orderId) {
        try {
            var res = await fetch('/api/Payments/complete/' + orderId, { method: 'POST' });
            var data = await res.json();

            if (res.ok && data.success) {
                showSuccess();
            } else {
                showError();
            }
        } catch (err) {
            showError();
        }
    }

    function showSuccess() {
        document.getElementById('card').innerHTML =
            '<div class="icon">✅</div>' +
            '<h2>Ödəniş uğurla tamamlandı!</h2>' +
            '<p>Bizi seçdiyiniz üçün təşəkkür edirik. Nuş olsun!</p>' +
            '<a href="index.html" class="btn">Ana səhifə</a>';
    }

    function showError() {
        if (!tableId) {
            document.getElementById('card').innerHTML =
                '<div class="icon">❌</div>' +
                '<h2>Ödəniş uğursuz oldu</h2>' +
                '<p>Masa tapılmadı.</p>';
            return;
        }

        document.getElementById('card').innerHTML =
            '<div class="icon">❌</div>' +
            '<h2>Ödəniş uğursuz oldu</h2>' +
            '<p>Ödəniş həyata keçirilmədi. Yenidən cəhd edin.</p>' +
            '<a href="menu.html?tableId=' + tableId + '" class="btn">Menyuya qayıt</a>';
    }
</script>
