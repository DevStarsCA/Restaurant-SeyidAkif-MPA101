# fly.toml app configuration file generated for restoran-app on 2026-03-09T01:32:26+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'restoran-app'
primary_region = 'ams'

[build]

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
